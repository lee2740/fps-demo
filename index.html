<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>1v1 Web FPS (Rivals Style)</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #87CEEB; font-family: sans-serif; user-select: none; }
        #gameUI { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: none; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 8px; height: 8px; background: white; border: 1px solid black; border-radius: 50%; transform: translate(-50%, -50%); }
        #hitMarker { position: absolute; top: 50%; left: 50%; width: 20px; height: 20px; border: 2px solid red; border-radius: 50%; transform: translate(-50%, -50%); display: none; }
        #status { position: absolute; bottom: 20px; left: 20px; color: white; text-shadow: 2px 2px 0 #000; font-size: 24px; font-weight: bold; }
        #damageOverlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: red; opacity: 0; transition: opacity 0.15s; }
        
        #menu { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.85); padding: 25px; border-radius: 10px; color: white; text-align: center; width: 320px; }
        textarea, button { width: 100%; margin: 8px 0; box-sizing: border-box; font-size: 14px; }
        textarea { height: 60px; resize: none; word-break: break-all; }
        button { padding: 10px; background: #4CAF50; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #45a049; }
        .step { display: none; margin-top: 10px; text-align: left; }
        .active { display: block; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/PointerLockControls.js"></script>
</head>
<body>

    <div id="menu">
        <h2>🔥 1v1 M4 Arena</h2>
        
        <div id="step-choose" class="step active">
            <button onclick="setupHost()">1. 방 만들기 (Host)</button>
            <button onclick="showStep('step-join')" style="background:#2196F3;">2. 방 참가하기 (Join)</button>
        </div>

        <div id="step-host" class="step">
            <p style="margin:0 0 5px 0;">👇 이 코드를 복사해서 친구에게 전달하세요:</p>
            <textarea id="myOffer" readonly></textarea>
            <p style="margin:10px 0 5px 0;">👇 친구가 준 코드를 붙여넣으세요:</p>
            <textarea id="hostAnswerInput" placeholder="응답 코드 붙여넣기"></textarea>
            <button onclick="acceptAnswer()">연결 완료 및 시작</button>
        </div>

        <div id="step-join" class="step">
            <p style="margin:0 0 5px 0;">👇 방장이 준 코드를 붙여넣으세요:</p>
            <textarea id="joinOfferInput" placeholder="방장 코드 붙여넣기"></textarea>
            <button onclick="setupJoin()">코드 생성하기</button>
            <div id="joinAnswerArea" style="display:none; margin-top:10px;">
                <p style="margin:0 0 5px 0;">👇 생성된 코드를 복사해 방장에게 주세요:</p>
                <textarea id="myAnswer" readonly></textarea>
            </div>
        </div>
    </div>

    <div id="gameUI">
        <div id="damageOverlay"></div>
        <div id="crosshair"></div>
        <div id="hitMarker"></div>
        <div id="status">
            HP: <span id="hpUI" style="color: #4CAF50;">100</span> | 
            M4: <span id="ammoUI">30</span> / 30 
            <span id="reloadUI" style="color: yellow; display: none;">(장전 중...)</span>
        </div>
    </div>

<script>
    let camera, scene, renderer, controls;
    let enemyGroup, enemyHead, enemyBody;
    
    let health = 100, ammo = 30, maxAmmo = 30, isReloading = false;
    let lastCombatTime = Date.now();
    
    const velocity = new THREE.Vector3(), direction = new THREE.Vector3();
    let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
    let prevTime = performance.now();

    let pc, dataChannel, isGameStarted = false;
    const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

    function showStep(id) {
        document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    async function setupHost() {
        showStep('step-host');
        pc = new RTCPeerConnection(rtcConfig);
        dataChannel = pc.createDataChannel('game');
        setupDataChannel();

        pc.onicecandidate = e => {
            if (!e.candidate) document.getElementById('myOffer').value = JSON.stringify(pc.localDescription);
        };

        const offer = await pc.createOffer();
        await pc.setLocalDescription(offer);
    }

    async function setupJoin() {
        const offerText = document.getElementById('joinOfferInput').value;
        if(!offerText) return alert('코드를 입력하세요!');
        
        pc = new RTCPeerConnection(rtcConfig);
        pc.ondatachannel = e => {
            dataChannel = e.channel;
            setupDataChannel();
        };

        pc.onicecandidate = e => {
            if (!e.candidate) {
                document.getElementById('myAnswer').value = JSON.stringify(pc.localDescription);
                document.getElementById('joinAnswerArea').style.display = 'block';
            }
        };

        await pc.setRemoteDescription(JSON.parse(offerText));
        const answer = await pc.createAnswer();
        await pc.setLocalDescription(answer);
    }

    async function acceptAnswer() {
        const answerText = document.getElementById('hostAnswerInput').value;
        if(!answerText) return alert('코드를 입력하세요!');
        await pc.setRemoteDescription(JSON.parse(answerText));
    }

    function setupDataChannel() {
        dataChannel.onopen = () => startGame();
        dataChannel.onmessage = e => {
            const data = JSON.parse(e.data);
            if (data.type === 'move') {
                enemyGroup.position.set(data.x, data.y, data.z);
                enemyGroup.rotation.y = data.ry;
            } else if (data.type === 'hit') {
                takeDamage(data.damage);
            }
        };
    }

    function init3D() {
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);

        camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const light = new THREE.HemisphereLight(0xffffff, 0x444444, 1.0);
        scene.add(light);

        const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshPhongMaterial({ color: 0x555555 }));
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        scene.add(new THREE.GridHelper(100, 40));

        const boxGeo = new THREE.BoxGeometry(4, 4, 4), boxMat = new THREE.MeshPhongMaterial({ color: 0x00aaee });
        [[10,2,-10], [-10,2,-10], [10,2,10], [-10,2,10], [0,2,-20]].forEach(p => {
            const b = new THREE.Mesh(boxGeo, boxMat); b.position.set(...p); scene.add(b);
        });

        enemyGroup = new THREE.Group();
        enemyGroup.position.set(0, -100, 0);

        enemyBody = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.8, 0.8), new THREE.MeshPhongMaterial({ color: 0xff4444 }));
        enemyBody.position.y = 0.9; enemyBody.name = "body"; enemyGroup.add(enemyBody);

        enemyHead = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), new THREE.MeshPhongMaterial({ color: 0xffaaaa }));
        enemyHead.position.y = 2.2; enemyHead.name = "head"; enemyGroup.add(enemyHead);

        scene.add(enemyGroup);

        controls = new THREE.PointerLockControls(camera, document.body);
        scene.add(controls.getObject());
        controls.getObject().position.set(0, 2, 10);
    }

    function startGame() {
        if(isGameStarted) return;
        isGameStarted = true;
        document.getElementById('menu').style.display = 'none';
        document.getElementById('gameUI').style.display = 'block';
        
        document.body.addEventListener('click', () => { if(isGameStarted) controls.lock(); });
        setupInputs();
        animate();
    }

    function setupInputs() {
        document.addEventListener('keydown', e => {
            switch (e.code) {
                case 'KeyW': moveForward = true; break;
                case 'KeyA': moveLeft = true; break;
                case 'KeyS': moveBackward = true; break;
                case 'KeyD': moveRight = true; break;
                case 'Space': if (canJump) velocity.y += 10; canJump = false; break;
                case 'KeyR': reloadM4(); break;
            }
        });
        document.addEventListener('keyup', e => {
            switch (e.code) {
                case 'KeyW': moveForward = false; break;
                case 'KeyA': moveLeft = false; break;
                case 'KeyS': moveBackward = false; break;
                case 'KeyD': moveRight = false; break;
            }
        });
        document.addEventListener('mousedown', e => { if(controls.isLocked && e.button === 0) shoot(); });
    }

    const raycaster = new THREE.Raycaster();
    function shoot() {
        if (isReloading) return;
        if (ammo <= 0) { reloadM4(); return; }

        ammo--;
        updateUI();
        lastCombatTime = Date.now();
        camera.rotation.x += 0.02;

        raycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
        const intersects = raycaster.intersectObjects(enemyGroup.children);

        if (intersects.length > 0) {
            const hitPart = intersects[0].object.name;
            let dmg = hitPart === 'head' ? 100 : (hitPart === 'body' ? 35 : 20);

            const marker = document.getElementById('hitMarker');
            marker.style.display = 'block';
            setTimeout(() => marker.style.display = 'none', 100);

            if(dataChannel && dataChannel.readyState === 'open') {
                dataChannel.send(JSON.stringify({ type: 'hit', damage: dmg }));
            }
        }
    }

    function reloadM4() {
        if(isReloading || ammo === maxAmmo) return;
        isReloading = true;
        document.getElementById('reloadUI').style.display = 'inline';
        setTimeout(() => {
            ammo = maxAmmo;
            isReloading = false;
            document.getElementById('reloadUI').style.display = 'none';
            updateUI();
        }, 2500);
    }

    function takeDamage(amount) {
        health -= amount;
        lastCombatTime = Date.now();
        
        const overlay = document.getElementById('damageOverlay');
        overlay.style.opacity = 0.5;
        setTimeout(() => overlay.style.opacity = 0, 150);

        if (health <= 0) {
            alert('죽었습니다! 리스폰 됩니다.');
            health = 100;
            ammo = maxAmmo;
            controls.getObject().position.set(Math.random()*10 - 5, 2, Math.random()*10 - 5);
        }
        updateUI();
    }

    setInterval(() => {
        if (!isGameStarted) return;
        if ((Date.now() - lastCombatTime) / 1000 >= 10 && health < 100) {
            health = Math.min(100, health + 5);
            updateUI();
        }
    }, 1000);

    function updateUI() {
        document.getElementById('hpUI').innerText = health;
        document.getElementById('hpUI').style.color = health > 50 ? '#4CAF50' : 'red';
        document.getElementById('ammoUI').innerText = ammo;
    }

    function animate() {
        requestAnimationFrame(animate);

        const time = performance.now();
        if (controls.isLocked === true) {
            const delta = (time - prevTime) / 1000;

            velocity.x -= velocity.x * 10.0 * delta;
            velocity.z -= velocity.z * 10.0 * delta;
            velocity.y -= 9.8 * 3.0 * delta;

            direction.z = Number(moveForward) - Number(moveBackward);
            direction.x = Number(moveRight) - Number(moveLeft);
            direction.normalize();

            if (moveForward || moveBackward) velocity.z -= direction.z * 40.0 * delta;
            if (moveLeft || moveRight) velocity.x -= direction.x * 40.0 * delta;

            controls.moveRight(-velocity.x * delta);
            controls.moveForward(-velocity.z * delta);
            controls.getObject().position.y += (velocity.y * delta);

            if (controls.getObject().position.y < 2) {
                velocity.y = 0;
                controls.getObject().position.y = 2;
                canJump = true;
            }

            if(dataChannel && dataChannel.readyState === 'open') {
                const pos = controls.getObject().position;
                const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                dataChannel.send(JSON.stringify({
                    type: 'move',
                    x: pos.x, y: pos.y - 2, z: pos.z,
                    ry: euler.y
                }));
            }
        }
        prevTime = time;
        renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
    });

    init3D();
</script>
</body>
</html>
